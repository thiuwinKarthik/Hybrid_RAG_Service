services:
  postgres:

    image: postgres:15-alpine
    container_name: rag_postgres
    environment:
      POSTGRES_DB: rag_enterprise
      POSTGRES_USER: rag_admin
      POSTGRES_PASSWORD: rag_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_admin -d rag_enterprise"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rag_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: rag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:6333/healthz || exit 0"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  rag-service:
    build:
      context: ./rag-service
      dockerfile: Dockerfile
    container_name: rag_fastapi_service
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - RERANKER_MODEL=${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gemini-1.5-pro}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started


  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: rag_express_gateway
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - RAG_SERVICE_URL=http://rag-service:8000
      - JWT_SECRET=super_secret_jwt_key_enterprise_rag_2026
    depends_on:
      - rag-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag_react_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_GATEWAY_URL=http://localhost:4000
    depends_on:
      - gateway

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
